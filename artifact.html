<style>
  /* Layout: sidebar fija + contenido; en móvil barra inferior + drawer. Dark & mostaza. */
  :root {
    color-scheme: dark;
    --bg: #0A0D14;
    --panel: #141821;
    --panel2: #1A1F2B;
    --sunken: #0F131B;
    --line: #252B38;
    --text: #EFECE4;
    --muted: #9A9FAC;
    --dim: #6B7180;
    --gold: #E5AC00;
    --gold-light: #FFD84D;
    --gold-deep: #B88600;
    --gold-line: rgba(229, 172, 0, .28);
    --gold-soft: rgba(229, 172, 0, .12);
    --gold-glow: 0 4px 22px rgba(229, 172, 0, .18);
    --gold-grad: linear-gradient(135deg, #C99300, #FFE066 38%, #E5AC00 68%, #FFD23F);
    --on-gold: #1A1300;
    --up: #34D399;
    --down: #F87171;
    --sky: #8AB4F8;
    --font-display: Outfit, "Plus Jakarta Sans", sans-serif;
    --font-body: "Plus Jakarta Sans", system-ui, sans-serif;
  }
  html { -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  body { background: var(--bg); color: var(--text); overflow-x: clip; font-family: var(--font-body); }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background: radial-gradient(900px 520px at 90% -10%, rgba(229,172,0,.08), transparent 60%),
                radial-gradient(700px 500px at -10% 40%, rgba(229,172,0,.04), transparent 60%);
  }
  #app, #auth, #boot { position: relative; z-index: 1; }
  h1, h2, h3 { text-wrap: balance; }
  .font-display { font-family: var(--font-display); letter-spacing: -.01em; }
  .tnum { font-variant-numeric: tabular-nums; }
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { scrollbar-width: none; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #2A3142; border-radius: 99px; }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; border-radius: 10px; }

  .text-muted { color: var(--muted); } .text-dim { color: var(--dim); }
  .text-gold { color: var(--gold); } .text-gold-light { color: var(--gold-light); }
  .text-up { color: var(--up); } .text-down { color: var(--down); }
  .gold-text { background: var(--gold-grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .glass { background: rgba(10, 13, 20, .74); backdrop-filter: blur(18px) saturate(140%); -webkit-backdrop-filter: blur(18px) saturate(140%); }

  .card { background: var(--panel); border: 1px solid rgba(229,172,0,.16); border-radius: 20px; transition: border-color .3s, box-shadow .3s, transform .3s; }
  .card-hover:hover { border-color: rgba(229,172,0,.45); box-shadow: var(--gold-glow); transform: translateY(-2px); }
  .well { background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.05); border-radius: 16px; }

  .btn-gold { background: var(--gold-grad); background-size: 220% 220%; background-position: 0% 50%; color: var(--on-gold); font-weight: 700; border-radius: 14px; min-height: 44px; display: inline-flex; align-items: center; justify-content: center; gap: .5rem; padding: 0 1.15rem; white-space: nowrap; transition: background-position .5s, box-shadow .3s, transform .2s; box-shadow: 0 2px 14px rgba(229,172,0,.2); }
  .btn-gold:hover { background-position: 100% 50%; box-shadow: 0 6px 26px rgba(229,172,0,.35); }
  .btn-gold:active { transform: scale(.97); }
  .btn-gold:disabled { opacity: .55; cursor: not-allowed; }
  .btn-ghost { min-height: 44px; display: inline-flex; align-items: center; justify-content: center; gap: .5rem; padding: 0 1rem; border-radius: 14px; border: 1px solid var(--gold-line); color: var(--text); background: rgba(255,255,255,.02); transition: .3s; font-weight: 600; white-space: nowrap; }
  .btn-ghost:hover { border-color: rgba(229,172,0,.6); color: var(--gold-light); box-shadow: 0 4px 20px rgba(229,172,0,.12); }
  .btn-ghost:disabled { opacity: .5; cursor: not-allowed; }
  .btn-danger { border-color: rgba(248,113,113,.45) !important; color: #FECACA !important; }
  .btn-danger:hover { background: rgba(248,113,113,.1) !important; }
  .btn-sm { min-height: 38px !important; font-size: .8rem; padding: 0 .8rem; border-radius: 12px; }
  @media (max-width: 767px), (pointer: coarse) { .btn-sm { min-height: 44px !important; } }
  .icon-btn { width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; border-radius: 12px; color: var(--muted); transition: .3s; border: 1px solid transparent; flex-shrink: 0; }
  .icon-btn:hover { color: var(--gold-light); background: var(--gold-soft); border-color: var(--gold-line); }
  .icon-btn.danger:hover { color: #FCA5A5; background: rgba(239,68,68,.08); border-color: rgba(239,68,68,.35); }
  .icon-btn:disabled { opacity: .35; pointer-events: none; }
  .icon-btn.sm { width: 36px; height: 36px; border-radius: 10px; }

  .seg { display: inline-flex; padding: 4px; gap: 2px; border-radius: 16px; background: rgba(255,255,255,.03); border: 1px solid rgba(229,172,0,.18); max-width: 100%; overflow-x: auto; scrollbar-width: none; }
  .seg::-webkit-scrollbar { display: none; }
  .seg button { min-height: 38px; padding: 0 .9rem; border-radius: 12px; font-size: .84rem; font-weight: 600; color: var(--muted); display: inline-flex; align-items: center; gap: .45rem; transition: .3s; white-space: nowrap; }
  .seg button:hover { color: var(--text); }
  .seg button[aria-pressed="true"] { background: var(--gold-soft); color: var(--gold-light); box-shadow: inset 0 0 0 1px rgba(229,172,0,.5); }

  .chip { min-height: 38px; padding: 0 .85rem; border-radius: 999px; font-size: .8rem; font-weight: 600; color: var(--muted); border: 1px solid var(--line); display: inline-flex; align-items: center; gap: .4rem; transition: .3s; white-space: nowrap; background: rgba(255,255,255,.02); }
  .chip:hover { border-color: rgba(229,172,0,.45); color: var(--text); }
  .chip[aria-pressed="true"] { border-color: transparent; color: var(--on-gold); background: var(--gold-grad); }
  .chip .count { font-size: .7rem; padding: 1px 7px; border-radius: 99px; background: rgba(255,255,255,.07); }
  .chip[aria-pressed="true"] .count { background: rgba(0,0,0,.15); }
  .chip:disabled { opacity: .4; pointer-events: none; }

  .badge { display: inline-flex; align-items: center; gap: .35rem; font-size: 11px; font-weight: 700; padding: .3rem .6rem; border-radius: 999px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); letter-spacing: .02em; white-space: nowrap; }
  .badge svg { width: 13px; height: 13px; }
  .badge-draft { background: rgba(23,23,23,.8); color: #D2CEC2; border: 1px solid rgba(229,172,0,.3); }
  .badge-scheduled { background: rgba(4,47,36,.85); color: #6EE7B7; border: 1px solid rgba(52,211,153,.5); }
  .badge-published { background: rgba(38,29,0,.85); color: var(--gold-light); border: 1px solid rgba(229,172,0,.6); }
  .badge-soft { background: var(--gold-soft); color: var(--gold-light); border: 1px solid var(--gold-line); }
  .badge-muted { background: rgba(255,255,255,.05); color: var(--muted); border: 1px solid var(--line); }
  .badge-up { background: rgba(52,211,153,.12); color: var(--up); border: 1px solid rgba(52,211,153,.35); }
  .badge-down { background: rgba(248,113,113,.12); color: var(--down); border: 1px solid rgba(248,113,113,.35); }
  .net-badge { display: inline-flex; align-items: center; gap: .4rem; padding: .3rem .6rem .3rem .3rem; border-radius: 999px; background: rgba(10,13,20,.66); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); font-size: 11px; font-weight: 700; color: #fff; border: 1px solid rgba(255,255,255,.12); }
  .net-dot { width: 22px; height: 22px; border-radius: 99px; display: inline-flex; align-items: center; justify-content: center; color: #fff; flex-shrink: 0; }
  .net-dot svg { width: 58%; height: 58%; }

  .input { width: 100%; min-height: 46px; background: var(--sunken); border: 1px solid var(--line); border-radius: 14px; padding: .7rem .95rem; color: var(--text); transition: .3s; font-size: .95rem; }
  .input::placeholder { color: #5D6475; }
  .input:focus { outline: none; border-color: rgba(229,172,0,.65); box-shadow: 0 0 0 4px rgba(229,172,0,.1); }
  .input[aria-invalid="true"] { border-color: rgba(248,113,113,.7); }
  select.input { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 2.2rem; }
  .label { font-size: .74rem; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: #BDB8A9; margin-bottom: .5rem; display: block; }
  .help { font-size: .75rem; color: var(--dim); margin-top: .4rem; }
  .err { font-size: .78rem; color: #FCA5A5; margin-top: .4rem; }
  input[type="range"] { accent-color: var(--gold); width: 100%; min-height: 28px; }
  input[type="color"] { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--sunken); padding: 4px; }
  input[type="checkbox"] { accent-color: var(--gold); width: 18px; height: 18px; }

  .switch { position: relative; width: 52px; height: 30px; border-radius: 99px; background: #2A3142; transition: .3s; flex-shrink: 0; }
  .switch::after { content: ""; position: absolute; top: 4px; left: 4px; width: 22px; height: 22px; border-radius: 99px; background: #8A90A0; transition: .3s; }
  .switch[aria-checked="true"] { background: var(--gold-grad); }
  .switch[aria-checked="true"]::after { left: 26px; background: var(--on-gold); }

  .dropzone { border: 1.5px dashed rgba(229,172,0,.35); border-radius: 18px; background: rgba(229,172,0,.03); transition: .3s; }
  .dropzone.drag { border-color: var(--gold); background: rgba(229,172,0,.09); box-shadow: 0 0 0 6px rgba(229,172,0,.08); }

  /* Sidebar */
  .nav-item { display: flex; align-items: center; gap: .75rem; min-height: 44px; padding: 0 .85rem; border-radius: 13px; color: var(--muted); font-weight: 600; font-size: .9rem; transition: .25s; width: 100%; text-align: left; position: relative; }
  .nav-item:hover { color: var(--text); background: rgba(255,255,255,.03); }
  .nav-item[aria-current="page"] { color: var(--gold-light); background: var(--gold-soft); box-shadow: inset 0 0 0 1px rgba(229,172,0,.35); }
  .nav-item[aria-current="page"] svg { color: var(--gold); }
  .nav-group { font-size: .66rem; font-weight: 800; letter-spacing: .2em; text-transform: uppercase; color: #5D6475; padding: 1rem .85rem .4rem; }

  /* Modales */
  .overlay { position: fixed; inset: 0; z-index: 60; background: rgba(4,6,12,.7); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); display: flex; align-items: flex-end; justify-content: center; animation: fade .25s ease; }
  @media (min-width: 768px) { .overlay { align-items: center; padding: 1.5rem; } }
  .sheet { width: 100%; max-height: 94vh; overflow-y: auto; background: #11151E; border: 1px solid rgba(229,172,0,.25); border-bottom: 0; border-radius: 28px 28px 0 0; box-shadow: 0 -10px 60px rgba(0,0,0,.5); animation: up .35s cubic-bezier(.2,.8,.2,1); overscroll-behavior: contain; }
  @media (min-width: 768px) { .sheet { border-radius: 28px; border-bottom: 1px solid rgba(229,172,0,.25); max-height: 90vh; animation: pop .3s cubic-bezier(.2,.8,.2,1); } }
  .sheet-head { position: sticky; top: 0; z-index: 5; background: rgba(17,21,30,.9); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
  .grabber { width: 44px; height: 5px; border-radius: 99px; background: #343B4C; margin: 10px auto 0; }
  @keyframes fade { from { opacity: 0; } }
  @keyframes up { from { transform: translateY(40px); } }
  @keyframes pop { from { transform: scale(.97); } }
  @keyframes rise { from { transform: translateY(12px); opacity: .001; } }
  .rise { animation: rise .55s cubic-bezier(.2,.8,.2,1) both; }
  .spin { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse-dot { 50% { opacity: .35; } }
  .pulse { animation: pulse-dot 1.4s ease-in-out infinite; }

  /* Charts */
  .draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.6s cubic-bezier(.6,.05,.25,1) forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .area-in { animation: areaIn 1.4s ease .4s both; }
  @keyframes areaIn { from { opacity: 0; } }
  .bar-grow { transform-box: fill-box; transform-origin: 50% 100%; animation: grow 1s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes grow { from { transform: scaleY(0); } }
  .hbar { transform-origin: left; animation: growx 1s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes growx { from { transform: scaleX(0); } }
  .chart-tip { position: absolute; pointer-events: none; background: rgba(17,21,30,.95); border: 1px solid var(--gold-line); border-radius: 12px; padding: .5rem .7rem; font-size: 12px; white-space: nowrap; transform: translate(-50%, -110%); box-shadow: 0 8px 24px rgba(0,0,0,.4); z-index: 5; }

  /* Métricas grandes */
  .metric-big { font-family: var(--font-display); font-weight: 700; font-size: clamp(2.2rem, 6vw, 3.4rem); line-height: 1; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .delta { display: inline-flex; align-items: center; gap: .3rem; font-weight: 700; font-size: .85rem; padding: .3rem .6rem; border-radius: 999px; }
  .delta.up { color: var(--up); background: rgba(52,211,153,.12); }
  .delta.down { color: var(--down); background: rgba(248,113,113,.12); }

  /* Phone mockup */
  .phone { width: 272px; max-width: 100%; aspect-ratio: 9 / 19.5; border-radius: 44px; padding: 10px; background: linear-gradient(145deg, #2a2a2a, #050505); box-shadow: 0 0 0 1px rgba(229,172,0,.45), 0 30px 80px rgba(0,0,0,.6), 0 0 60px rgba(229,172,0,.12); position: relative; flex-shrink: 0; }
  .phone-screen { width: 100%; height: 100%; border-radius: 34px; overflow: hidden; position: relative; background: #000; color: #fff; font-size: 12px; }
  .phone-notch { position: absolute; top: 18px; left: 50%; transform: translateX(-50%); width: 84px; height: 24px; background: #000; border-radius: 99px; z-index: 20; }
  .phone-scroll { height: 100%; overflow-y: auto; scrollbar-width: none; }
  .phone-scroll::-webkit-scrollbar { display: none; }
  .clamp-1, .clamp-2, .clamp-3 { display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; }
  .clamp-1 { -webkit-line-clamp: 1; } .clamp-2 { -webkit-line-clamp: 2; } .clamp-3 { -webkit-line-clamp: 3; }

  .cal-cell { min-height: 66px; }
  @media (min-width: 768px) { .cal-cell { min-height: 128px; } }

  /* Editor de video */
  .ed-stage { background: repeating-conic-gradient(#12161F 0% 25%, #0F131B 0% 50%) 50% / 20px 20px; }
  .tl-wrap { position: relative; overflow-x: auto; overflow-y: hidden; background: var(--sunken); border-radius: 16px; border: 1px solid var(--line); }
  .tl-inner { position: relative; min-width: 100%; }
  .tl-ruler { height: 28px; position: relative; border-bottom: 1px solid var(--line); cursor: pointer; }
  .tl-tick { position: absolute; top: 0; bottom: 0; border-left: 1px solid #2A3142; font-size: 10px; color: var(--dim); padding-left: 3px; padding-top: 6px; }
  .tl-track { position: relative; height: 62px; border-bottom: 1px solid rgba(255,255,255,.04); }
  .tl-track.t-text { height: 40px; } .tl-track.t-audio { height: 46px; }
  .tl-clip { position: absolute; top: 6px; bottom: 6px; border-radius: 10px; overflow: hidden; cursor: grab; border: 1.5px solid rgba(255,255,255,.12); background-size: auto 100%; background-repeat: repeat-x; user-select: none; touch-action: none; }
  .tl-clip.sel { border-color: var(--gold); box-shadow: 0 0 0 2px rgba(229,172,0,.35); z-index: 2; }
  .tl-clip .lbl { position: absolute; left: 8px; right: 8px; bottom: 4px; font-size: 10.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 1px 3px #000; pointer-events: none; }
  .tl-clip .h { position: absolute; top: 0; bottom: 0; width: 10px; cursor: ew-resize; z-index: 3; }
  .tl-clip .h:hover, .tl-clip.sel .h { background: rgba(229,172,0,.55); }
  .tl-clip .h.l { left: 0; } .tl-clip .h.r { right: 0; }
  .tl-head { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--gold); z-index: 6; pointer-events: none; }
  .tl-head::before { content: ""; position: absolute; top: 0; left: -6px; border: 7px solid transparent; border-top: 9px solid var(--gold); }
  .tl-marker { position: absolute; top: 0; width: 2px; height: 28px; background: var(--sky); z-index: 5; }

  .bottom-nav { padding-bottom: env(safe-area-inset-bottom, 0px); }
  .fab { bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }
  .topbar { top: env(safe-area-inset-top, 0px); }
  .skip { position: absolute; left: -999px; top: 8px; z-index: 100; }
  .skip:focus { left: 8px; background: var(--gold); color: #000; padding: .6rem 1rem; border-radius: 10px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0ms !important; transition-duration: .01ms !important; }
    .draw { stroke-dashoffset: 0; }
  }
</style>
